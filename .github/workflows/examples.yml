name: Generate examples

on:
  schedule:
    - cron: "0 0 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: smoke test
        run: node test/smoke.mjs

      - name: generate every game
        uses: ./
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/platformer-dark.svg?game=platformer&palette=github-dark
            dist/platformer-light.svg?game=platformer&palette=github-light
            dist/blocks-dark.svg?game=blocks&palette=github-dark
            dist/blocks-light.svg?game=blocks&palette=github-light
            dist/invaders-dark.svg?game=invaders&palette=github-dark
            dist/invaders-light.svg?game=invaders&palette=github-light
            dist/breakout-dark.svg?game=breakout&palette=github-dark
            dist/breakout-light.svg?game=breakout&palette=github-light
            dist/life-dark.svg?game=life&palette=github-dark
            dist/life-light.svg?game=life&palette=github-light
            dist/rain-dark.svg?game=rain&palette=github-dark
            dist/rain-light.svg?game=rain&palette=github-light

      - name: push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
